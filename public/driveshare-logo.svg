<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Cyan-Teal Highway Gradients -->
    <linearGradient id="dsRoadLeft" x1="6" y1="52" x2="28" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#326071" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#70B6D0" />
      <stop offset="100%" stop-color="#E8F0F7" />
    </linearGradient>
    <linearGradient id="dsRoadRight" x1="50" y1="52" x2="28" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#326071" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#70B6D0" />
      <stop offset="100%" stop-color="#E8F0F7" />
    </linearGradient>
    <linearGradient id="dsCenterGuideway" x1="28" y1="52" x2="28" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70B6D0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="dsApexGlow" cx="28" cy="10" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70B6D0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#70B6D0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- OFFICIAL DRIVESHARE BRAND EMBLEM (Aerodynamic Highway Road Convergence - NO SHIELD) -->
  <g id="driveshare-symbol">
    <!-- Ambient Horizon Glow -->
    <circle cx="28" cy="12" r="10" fill="url(#dsApexGlow)" />

    <!-- Left Aerodynamic Highway Arc Ribbon -->
    <path d="M8 48C14 42 22 28 26 12C26.8 8.8 28 8.8 28.5 12C26.5 28 17 45 12 50C10.5 51.5 8 50.5 8 48Z" fill="url(#dsRoadLeft)"/>

    <!-- Right Aerodynamic Highway Arc Ribbon -->
    <path d="M48 48C42 42 34 28 30 12C29.2 8.8 28 8.8 27.5 12C29.5 28 39 45 44 50C45.5 51.5 48 50.5 48 48Z" fill="url(#dsRoadRight)"/>

    <!-- Dual Converging Highway Guideway Lines -->
    <path d="M14 48L26 14" stroke="#70B6D0" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 48L30 14" stroke="#70B6D0" stroke-width="2" stroke-linecap="round"/>

    <!-- Center Photon Road Trajectory Markers -->
    <line x1="28" y1="48" x2="28" y2="40" stroke="url(#dsCenterGuideway)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="34" x2="28" y2="28" stroke="url(#dsCenterGuideway)" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="24" x2="28" y2="20" stroke="url(#dsCenterGuideway)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Apex Horizon Light Beacon -->
    <circle cx="28" cy="12" r="2.5" fill="#FFFFFF"/>
    <circle cx="28" cy="12" r="5" stroke="#70B6D0" stroke-width="1" stroke-opacity="0.8"/>
  </g>

  <!-- OFFICIAL DRIVESHARE WORDMARK -->
  <g id="driveshare-wordmark">
    <!-- DRIVE in Crisp White -->
    <text x="68" y="34" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="1">DRIVE</text>
    <!-- SHARE in Brand Cyan -->
    <text x="140" y="34" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="24" fill="#70B6D0" letter-spacing="1">SHARE</text>

    <!-- OFFICIAL TAGLINE -->
    <text x="69" y="48" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="7.5" fill="#94A4B5" letter-spacing="1.4">YOUR CAR. YOUR JOURNEY. YOUR DRIVER.</text>
  </g>
</svg>
